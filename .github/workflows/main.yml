name: Build SocialPilot AI Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show repository files
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          Get-ChildItem -Force
          if (!(Test-Path "main.py")) { throw "main.py is missing from repository root." }
          if (!(Test-Path "requirements.txt")) { throw "requirements.txt is missing from repository root." }
          if (!(Test-Path "SocialPilotAI-Setup.iss")) { throw "SocialPilotAI-Setup.iss is missing from repository root." }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        shell: pwsh
        run: python -m py_compile main.py

      - name: Build application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SocialPilotAI --collect-all PySide6 --collect-all keyring --hidden-import keyring.backends.Windows main.py
          if (!(Test-Path "dist\SocialPilotAI\SocialPilotAI.exe")) { throw "PyInstaller did not create SocialPilotAI.exe." }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found at $iscc" }
          & $iscc "SocialPilotAI-Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "installer\SocialPilotAI-Setup-4.0.0.exe")) { throw "Installer EXE was not generated." }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SocialPilotAI-Windows-Installer
          path: installer/SocialPilotAI-Setup-4.0.0.exe
          if-no-files-found: error
