name: Build SocialPilot AI Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # The repository name ends in a period. Windows cannot use that as a
      # directory name, so always check out into this safe path.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: source

      - name: Verify source files
        shell: pwsh
        run: |
          Write-Host "Checked out source to: $env:GITHUB_WORKSPACE\source"
          Get-ChildItem -Force source
          $required = @(
            "source\main.py",
            "source\requirements.txt",
            "source\SocialPilotAI-Setup.iss"
          )
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required file not found: $file" }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r source\requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        shell: pwsh
        run: python -m py_compile source\main.py

      - name: Build application
        shell: pwsh
        run: |
          Push-Location source
          try {
            python -m PyInstaller --noconfirm --clean --windowed --onedir --name SocialPilotAI --collect-all PySide6 --collect-all keyring --hidden-import keyring.backends.Windows main.py
            if (!(Test-Path "dist\SocialPilotAI\SocialPilotAI.exe")) {
              throw "PyInstaller did not create dist\SocialPilotAI\SocialPilotAI.exe"
            }
          }
          finally {
            Pop-Location
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        shell: pwsh
        run: |
          Push-Location source
          try {
            New-Item -ItemType Directory -Force -Path installer | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
            & $iscc "SocialPilotAI-Setup.iss"
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
            if (!(Test-Path "installer\SocialPilotAI-Setup-4.0.0.exe")) {
              throw "Expected installer was not generated in source\installer"
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SocialPilotAI-Windows-Installer
          path: source/installer/SocialPilotAI-Setup-4.0.0.exe
          if-no-files-found: error
