name: Build SocialPilot AI Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: source

    steps:
      - name: Checkout repository to a Windows-safe folder
        uses: actions/checkout@v4
        with:
          path: source

      - name: Verify source files
        run: |
          Write-Host "Source directory: $env:GITHUB_WORKSPACE\source"
          Get-ChildItem -Force
          $required = @("main.py", "requirements.txt", "SocialPilotAI-Setup.iss")
          foreach ($file in $required) {
            if (!(Test-Path $file)) { throw "Required file is missing: $file" }
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Check Python syntax
        run: python -m py_compile main.py

      - name: Build SocialPilot AI desktop application
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --name SocialPilotAI --collect-all PySide6 --collect-all keyring --hidden-import keyring.backends.Windows main.py
          if (!(Test-Path "dist\SocialPilotAI\SocialPilotAI.exe")) {
            throw "PyInstaller did not create dist\SocialPilotAI\SocialPilotAI.exe"
          }

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compile Windows installer
        run: |
          New-Item -ItemType Directory -Force -Path installer | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler was not found: $iscc" }
          & $iscc "SocialPilotAI-Setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "installer\SocialPilotAI-Setup-4.0.0.exe")) {
            throw "Installer EXE was not generated."
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SocialPilotAI-Windows-Installer
          path: source/installer/SocialPilotAI-Setup-4.0.0.exe
          if-no-files-found: error
